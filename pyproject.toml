[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coding-agent-benchmarks"
version = "0.1.0"
description = "Vendor-neutral benchmark for coding agents on repo-based Python tasks"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "AI Dev Labs Open" }
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]
anthropic = ["anthropic>=0.40"]
all = ["anthropic>=0.40", "pytest>=8.0"]

[project.scripts]
bench = "coding_agent_benchmarks.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
